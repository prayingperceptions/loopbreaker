[project]
name = "loopbreaker"
version = "0.1.0"
description = "Stall detection for any agent loop: nudge the agent to try a new tactic, then escalate before it burns money spinning in place."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "prayingperceptions" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/prayingperceptions/loopbreaker"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loopbreaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
